name: ScreenshotFromVideos

options:
  bundleIdPrefix: com.lucesumbrarum
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: FDMSRXXN73
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1000"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder.git
    from: 0.15.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"
  # In-app Help engine, vendored from 1-macOS/appHELP. Content lives in ScreenshotFromVideos/Help/.
  HelpMenu:
    path: HelpMenu
  # AppCitizenshipKit bundles Feedback (re-exports FeedbackKit) + Tip Jar + About behind one config.
  AppCitizenshipKit:
    url: https://github.com/Xpycode/AppCitizenshipKit
    from: "0.1.2"

targets:
  ScreenshotFromVideos:
    type: application
    platform: macOS
    sources:
      - path: ScreenshotFromVideos
      # App icon: Icon Composer master in 02_Design (single source of truth),
      # referenced in place. macOS 26+ draws the shape itself, so a pre-shaped
      # PNG appiconset gets "jailed" on a grey plate in the Dock.
      - path: ../02_Design/StillsFromVideos-icon.icon
        type: file
    dependencies:
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
      - package: Sparkle
        product: Sparkle
      - package: AppCitizenshipKit
      - package: HelpMenu
        product: HelpMenu
    info:
      path: ScreenshotFromVideos/Info.plist
      properties:
        CFBundleName: Stills From Video
        CFBundleDisplayName: Stills From Video
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "Copyright © 2026 Luces Umbrarum. All rights reserved."
        NSHighResolutionCapable: true
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
        # Sparkle auto-update. SUPublicEDKey is the public half of the
        # eH6j… EdDSA key (same as DiskVerdict; switched from o388… 2026-11-13
        # before 1.0 shipped, because the release Mac holds eH6j…) — the private key
        # in Keychain signs each release's DMG via `sign_update`. The appcast
        # is served from the repo root on `main`. SUEnableAutomaticChecks lets
        # Sparkle prompt once on first launch, then check ~daily in background.
        SUEnableAutomaticChecks: true
        SUFeedURL: https://raw.githubusercontent.com/Xpycode/ScreenshotFromVideos/main/appcast.xml
        SUPublicEDKey: eH6joIk0G+i5Hur25e/9B4hF3jN8q5lBqXzMxuOfcxw=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucesumbrarum.ScreenshotFromVideos
        # User-facing .app filename (Finder, /Applications, DMG) = "Stills From Video".
        # Module name pinned to the internal identifier so it doesn't become
        # "Stills_From_Video". Target, scheme and bundle ID stay ScreenshotFromVideos.
        PRODUCT_NAME: "Stills From Video"
        PRODUCT_MODULE_NAME: ScreenshotFromVideos
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: StillsFromVideos-icon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
